[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tile-takeoff"
version = "0.1.0"
description = "Tile quantities and cutting layouts computed from a floor plan, not guessed."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hany", email = "hanysyria@gmail.com" }]
keywords = ["construction", "tiling", "takeoff", "quantity-surveying", "floor-plan", "waste"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hanysyria/tile-takeoff"
Issues = "https://github.com/hanysyria/tile-takeoff/issues"

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
draw = ["matplotlib>=3.7"]
all = ["pymupdf>=1.23", "matplotlib>=3.7"]
dev = ["pymupdf>=1.23", "matplotlib>=3.7", "pytest>=7.4"]

[project.scripts]
tile-takeoff = "tile_takeoff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tile_takeoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
