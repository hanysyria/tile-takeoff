name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check the CLI actually runs
        run: |
          tile-takeoff --version
          tile-takeoff optimize --slab 295x175 --area 98

  browser-port:
    # The browser build reimplements the cutting maths in JavaScript. If the two
    # ever disagree, somebody orders the wrong amount of tile — so both are tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/cutting.test.mjs
